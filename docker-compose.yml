services:
  # -------------------------------------------------------------
  # 1. SQL Server Database
  # -------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: talentsyncai-db
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - talentsyncai-net

  # -------------------------------------------------------------
  # 2. AI Service (Python / FastAPI)
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: talentsyncai-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_NAME=TalentSync-AI Service
      - APP_VERSION=1.0.0
      - APP_DESCRIPTION=AI service for candidate CV parsing, job matching, company recon, resume tailoring, and interview preparation.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-api-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://backend.sovereigneg.com/v1}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY:-}
      - CV_PARSER_MODEL=openai:gpt-4o-mini
      - JOB_PARSER_MODEL=openai:gpt-4o-mini
      - MATCHER_MODEL=openai:gpt-4o
      - COMPANY_RECON_MODEL=openai:gpt-4o
      - RESUME_TAILOR_MODEL=openai:gpt-4o
      - INTERVIEW_PREP_MODEL=openai:gpt-4o
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - talentsyncai-net

  # -------------------------------------------------------------
  # 3. Backend Web API (ASP.NET Core / .NET 10)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentsyncai-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TalentSyncAIDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - AiService__BaseUrl=http://ai-service:8000
      - AiService__InternalApiKey=${INTERNAL_API_KEY:-dev-internal-api-key}
      - Storage__UploadDirectory=/app/Storage/Uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - backend_uploads:/app/Storage/Uploads
    networks:
      - talentsyncai-net

volumes:
  sqlserver_data:
    name: talentsyncai_sqlserver_data
  backend_uploads:
    name: talentsyncai_backend_uploads

networks:
  talentsyncai-net:
    name: talentsyncai-network
    driver: bridge
